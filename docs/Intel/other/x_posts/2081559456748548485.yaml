text: |
  JFK's secret mistress, Mary Pinchot Meyer, was murdered 11 months after he was. He first danced with her in high school at a prom in 1935. He was completely in love with her and they had at least 30 trysts during his short stint as president.

  He wrote her a love letter in October 1963, begging her to come see him in Boston. It was never delivered, and it's not known if they met up. It sold recently for $89,000:

  "Why don't you leave suburbia for once—come and see me—either here—or at the Cape next week or in Boston the 19th. I know it is unwise, irrational, and that you may hate it—on the other hand, you may not—and I will love it. You say that it is good for me not to get what I want. After all of these years—you should give me a more loving answer than that. Why don't you just say yes."

  Mary initially had communist sympathies and was once upon a time under FBI surveillance when she was a member of the American Labor Party. It was all very odd, too, as she was married to a high-level CIA officer named Cord Meyer, whom she later divorced.

  Mary was obsessed with world peace & nuclear disarmament—which was one of JFK's major goals—to eliminate the threat of a nuclear arms race & global holocaust. JFK & Mary would smoke marijuana, have sex, and talk for long hours in the White House about real substantive issues when Jackie wasn't around. It's said that he valued her opinion above all other women. In 1983, in a dubious tale, Timothy Leary claimed they also did LSD, which he supplied.

  White House counsel Myer Feldman recalled frequently seeing Mary in the Oval Office or presidential residence. According to Feldman, Kennedy did not routinely send her away when official business was discussed, as he sometimes did with other social visitors. Feldman believed Kennedy's admiration for her was obvious and even considered using Mary as an informal conduit when he needed to get something before the president, since he took her so seriously.

  Mary & JFK carried on throughout the entirety of JFK's covert battle with Israeli Prime Minister David Ben Gurion over Israel's nuclear program.

  In January 1963, at a meeting of national newspaper publishers, Washington Post owner Phil Graham spilled the beans about the secret affair. Graham was a close friend of both, but had a drinking problem and would occasionally run his mouth. All 3 were members of an informal group of elites & insiders known as the "Georgetown Set." CIA Counterintel Chief & head of the Israel desk James Angleton was also a member of this group and was the godfather to Mary's children.

  Several months after his outburst, in August 1963, Phil Graham died in what the poster contends was a staged suicide. He allegedly rigged a shotgun to shoot himself in the head, but then fall into the bathtub so as to not leave a mess.

  His wife Katharine Meyer Graham then took over the Washington Post. Her father Eugene Meyer had been head of the Federal Reserve and president of the World Bank. Phil had been stepping out on her and was preparing to leave her for a mistress of his own. The death took care of that looming divorce.

  Suffice it to say that Phil was connected and in-the-know. He was also close friends with Lyndon Johnson. I imagine he would have been a problematic factor if he'd still been around to give the JFK assassination a proper investigation.

  Did Phil refuse to play ball? Or did the conspirators fear he wouldn't? Did they fear his loose mouth? Did they remove him beforehand, just in case?

  One of Phil Graham's famous quotes is printed on the wall inside the entrance to the Israel Government Press Office in Jerusalem as an homage to him: "Journalism is the first rough draft of history."

  Back to Mary Pinchot.

  She kept a secret diary.

  About one year after JFK had left that love letter for her, on October 12, 1964—while on an afternoon walk—she was shot: 2 shots to the back within a few inches, the gun possibly touching her. The first was to the back of her head. The second was through her back that ruptured her aorta and she bled out.

  The "culprit" was never caught.

  The evening she was killed, CIA counterintelligence chief James Angleton broke into her studio looking for the diary.

  He eventually obtained it and either burned it, or burned some pages & returned it, or never returned it at all. There are so many conflicting accounts that the truth can't be definitively discerned.

  Of course, the CIA actually has a full catalog of the entire contents of the 40 secret vaults Angleton left behind. But they've never disclosed that information. So maybe her diary still exists somewhere in the dark corners of the CIA, and along with it the motive behind her assassination.

  The crime was never solved. A 2017 FOIA request revealed that the FBI burned some of her files in 1988, and still others somehow evaporated into thin air around 1994 when they were supposed to have been transferred from the FBI to the National Archives under the 1992 JFK Records Act.

  Did Mary know about the fight JFK was embroiled in with Ben Gurion? Did she know about Israel's nuclear program? Was someone worried that she did? It wouldn't be until 1995 that documentary evidence was released verifying that JFK was fighting with Ben Gurion, and it wasn't until 2019 that all the letters between them and other records were finally made public.

