text: |
  👀 WTF?? Hayden Panettiere JUST DIED at 36… 3 months after her bombshell exposure of the Elite Hollywood/ Music system.

  Above all she was a mom. She leaves behind her daughter Kaya.

  Barely three months after she finally spoke up. In her new book and on that Jay Shetty podcast she told the world what happened when she was 18 and Heroes was exploding.

  A "trusted" female friend dragged her downstairs on a boat out at sea and literally put her in bed next to a naked, very famous older British rocker.

  She had to fight him off and hide for the rest of the night.

  That was 18 years ago. She still never named him. Or the woman who set it up.

  And now she's dead. Cause still unknown. She had just flown from LA down to the South with her boyfriend when it happened.

  Hollywood is pure evil.
  Who was the rocker?

  Who was the friend that kept doing these setups?
  @StephenBaldwin7 you were right… IT'S ALL OF THEM.
