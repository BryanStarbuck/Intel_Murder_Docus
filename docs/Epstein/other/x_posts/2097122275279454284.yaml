text: '🚨MANUEL SCHADWALD: El niño cuya muerte fue filmada en el yate de la élite y apareció en los CD-ROM
  de Zandvoort.


  El 24 de julio de 1993, Manuel Schadwald, un niño alemán de doce años, salió de su casa en Berlín. Iba
  solo. Nunca regresó.


  La policía abrió una investigación. En 1998 la cerró sin resultados. Sin cuerpo. Sin culpables. Sin
  respuestas.


  Mientras tanto, en Bélgica y Países Bajos, activistas descubrieron que las pistas llevaban a una red
  mucho más oscura.


  Manuel fue secuestrado y llevado a burdeles de niños en Ámsterdam y Rotterdam. Pero la versión más terrorífica
  apunta al yate Apollo.


  Según testimonios e inteligencia holandesa, en ese velero el niño fue abusado y asesinado mientras lo
  grababan. Un snuff film real. El cuerpo fue arrojado al mar y el yate limpiado en un puerto militar.


  El yate estaba vinculado a Gerrit Ulrich, implicado en el escándalo de Zandvoort (1998). Tras su muerte,
  la policía encontró miles de imágenes y vídeos de abuso infantil extremo, incluyendo bebés, junto con
  listas de clientes de varios países.


  Una de las personas que investigó esta conexión fue Gina Pardaens-Bernaer, trabajadora social belga.
  Su trabajo la llevó al material de Zandvoort. Envió copias a Interpol. Recibió amenazas. Su hijo fue
  atropellado. En noviembre de 1998 dijo: “Con lo que he descubierto, o Bélgica explota o me asesinan”.


  Al día siguiente su coche apareció destrozado contra un puente, sin marcas de frenado. La policía lo
  cerró como accidente. Horas después allanaron el despacho de su abogado. Gina murió.


  Su caso se suma a la lista de muertes sospechosas vinculadas a estas investigaciones.


  El caso de Manuel está directamente conectado con el caso Dutroux. Las mismas redes. Las mismas acusaciones
  de protección institucional. Las mismas sospechas de que personas influyentes estaban involucradas y
  que las investigaciones fueron frenadas cuando apuntaban demasiado alto.


  Las autoridades nunca investigaron a fondo las conexiones con el yate Apollo ni con Zandvoort. La policía
  holandesa dijo que no encontró nada. La policía alemana cerró el caso sin conectar los puntos. Y sin
  embargo, los documentos existen.


  Archivos de inteligencia holandesa hablan de un niño alemán asesinado en un barco y de un caso tapado
  porque “había personas influyentes a bordo”. Los testimonios detallan hechos y nombres. Gina Pardaens
  aseguró tener una copia del snuff film. Esa copia desapareció tras su muerte.


  Treinta y dos años después, Manuel Schadwald sigue desaparecido. No hay justicia.


  Este caso no es solo la historia de un niño que desapareció.


  Es la historia de cómo una red de abuso infantil operó durante años en Europa con impunidad. Cómo las
  investigaciones se detenían cuando llegaban demasiado cerca del poder. Cómo un niño de doce años pudo
  ser secuestrado, abusado y asesinado mientras alguien lo filmaba… y el sistema decidió que era mejor
  no mirar.


  Manuel quería ir a jugar un día de verano.


  Terminó en un yate de la élite, siendo violado y asesinado mientras grababan su muerte. Y 32 años después
  seguimos sin saber quiénes estaban en ese barco.


  La verdad está ahí. En los documentos. En los testimonios. En las conexiones con Zandvoort y Dutroux.


  La pregunta ya no es qué le pasó a Manuel Schadwald.


  La pregunta es: ¿cuánto tiempo más vamos a seguir permitiendo que estos casos queden archivados mientras
  los responsables siguen protegidos?'
